<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iDentity Prompt Engine</title>
<style>
  :root{
    --ink:#141416; --plate:#1b1b1e; --line:#2b2b2f;
    --ember:#d9541e; --ember-bright:#ff7a3d; --text:#e9e6e1; --ash:#8d8a86;
    --font-display: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(1200px 500px at 15% -10%, rgba(217,84,30,0.10), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(221,154,53,0.06), transparent 55%),
      var(--ink);
    color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); text-align:center; padding:24px;
  }
  .wrap{ max-width:420px; }
  .eyebrow{
    font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ember-bright);
  }
  h1{ font-family:var(--font-display); font-size:44px; margin:10px 0 18px; }
  .langs{ display:flex; flex-direction:column; gap:12px; margin-top:28px; }
  a.lang{
    display:block; padding:16px 20px; border-radius:10px; border:1px solid var(--line);
    color:var(--text); text-decoration:none; font-size:15px; transition:all .15s ease;
  }
  a.lang:hover{ border-color:var(--ember); background:rgba(217,84,30,0.10); }
  .lang b{ color:var(--ember-bright); }
  .brand-dot{
    width:6px; height:6px; border-radius:50%; background:var(--ember-bright);
    box-shadow:0 0 8px 1px rgba(217,84,30,.5); display:inline-block; margin-right:8px;
  }
  footer{ margin-top:40px; font-size:11px; color:var(--ash); letter-spacing:.04em; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">iDentity Prompt Engine</div>
    <h1>Music DNA</h1>
    <div class="langs">
      <a class="lang" href="en.html"><b>English</b> — Suno prompt engine</a>
      <a class="lang" href="ru.html"><b>Русский</b> — движок Suno-промптов</a>
    </div>
    <footer><span class="brand-dot"></span>iDentity Prompt Engine</footer>
  </div>
</body>
</html>
