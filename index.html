<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iDentity Prompt Engine</title>
<style>
  :root{
    --ink:#0F1313; --plate:#1b1b1e; --line:#3A362E;
    --ember:#FF7F44; --ember-bright:#FF7F44; --text:#E8E6E3; --ash:#9E9589;
    --font-display: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    background: var(--ink);
    color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); text-align:center; padding:32px 20px;
  }
  .wrap{ width:100%; max-width:420px; }
  .eyebrow{
    font-size:12.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--ember-bright);
    margin:0 0 14px;
  }
  h1{ font-family:var(--font-display); font-size:clamp(44px, 12vw, 64px); line-height:0.95; margin:0 0 40px; }
  .langs{ display:flex; flex-direction:column; gap:12px; }
  a.lang{
    display:block; padding:18px 20px; border-radius:12px; border:1px solid var(--line);
    color:var(--text); text-decoration:none; font-size:15px; transition:all .15s ease;
  }
  a.lang:hover{ border-color:var(--ember); background:rgba(255,127,68,0.10); }
  .lang b{ color:var(--ember-bright); }
  .brand-dot{
    width:6px; height:6px; border-radius:50%; background:var(--ember-bright);
    box-shadow:0 0 8px 1px rgba(255,127,68,.5); display:inline-block; margin-right:8px;
  }
  footer{ margin-top:40px; font-size:12.5px; color:var(--ash); letter-spacing:.04em; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">iDentity Prompt Engine</div>
    <h1>Music DNA</h1>
    <div class="langs">
      <a class="lang" href="en.html"><b>English</b> — Suno prompt engine</a>
      <a class="lang" href="ru.html"><b>Русский</b> — движок Suno-промптов</a>
    </div>
    <footer><span class="brand-dot"></span>iDentity Prompt Engine</footer>
  </div>
</body>
</html>
